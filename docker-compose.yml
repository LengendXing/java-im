version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: im_root_pass
      MYSQL_DATABASE: im_db
      MYSQL_USER: im_user
      MYSQL_PASSWORD: im_pass_2024
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  dufs:
    image: sigoden/dufs:latest
    ports:
      - "5100:5100"
    volumes:
      - uploads_data:/app/uploads
    command: /app/uploads --port 5100 --allow-upload --allow-delete --allow-search
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5100/"]
      interval: 5s
      retries: 5

  folkmq:
    image: noearorg/folkmq-broker:1.7.13
    ports:
      - "18602:18602"
      - "8602:8602"
    environment:
[108 more lines]  redis_data:
  mysql_data:
  uploads_data:
  folkmq_data:

  # === Observability Stack ===

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    depends_on:
      - im-server
    restart: on-failure

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/java-im.json
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/java-im.json
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: on-failure

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    restart: on-failure

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: on-failure

volumes:
  redis_data:
  mysql_data:
  uploads_data:
  folkmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  rnacos_data:

  # === Service Registry ===

  rnacos:
    image: qingpan/rnacos:stable
    ports:
      - "8848:8848"
      - "10848:10848"
    environment:
      RNACOS_RUN_MODE: standalone
      RNACOS_CONFIG_DB_DIR: /data/nacos_db
    volumes:
      - rnacos_data:/data
    restart: on-failure
