version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: im_root_pass
      MYSQL_DATABASE: im_db
      MYSQL_USER: im_user
      MYSQL_PASSWORD: im_pass_2024
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  dufs:
    image: sigoden/dufs:latest
    ports:
      - "5100:5100"
    volumes:
      - uploads_data:/app/uploads
    command: /app/uploads --port 5100 --allow-upload --allow-delete --allow-search
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5100/"]
      interval: 5s
      retries: 5

  folkmq:
    image: noearorg/folkmq-broker:1.7.13
    ports:
      - "18602:18602"
      - "8602:8602"
    environment:
      FOLKMQ_BROKER_DEFAULT: "folkmq:18602"
    volumes:
      - folkmq_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8602/"]
      interval: 5s
      retries: 5

  im-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8800:8800"   # TCP
      - "8801:8801"   # WebSocket
      - "8080:8080"   # HTTP API
    environment:
      IM_REDIS_HOST: redis
      IM_REDIS_PORT: 6379
      IM_MYSQL_HOST: mysql
      IM_MYSQL_PORT: 3306
      IM_MYSQL_DB: im_db
      IM_MYSQL_USER: im_user
      IM_MYSQL_PASSWORD: im_pass_2024
      IM_JWT_SECRET: change-me-in-production-env
      IM_FOLKMQ_HOST: folkmq
      IM_FOLKMQ_PORT: 18602
      DUFS_URL: http://dufs:5100
      dufs.upload.dir: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      dufs:
        condition: service_healthy
      folkmq:
        condition: service_healthy
    restart: on-failure

  im-web:
    build:
      context: ./client-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - im-server
    restart: on-failure

volumes:
  redis_data:
  mysql_data:
  uploads_data:
  folkmq_data:
