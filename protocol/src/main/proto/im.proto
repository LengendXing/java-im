syntax = "proto3";
package im.protocol;

option java_package = "com.im.protocol";
option java_outer_classname = "ImProto";

// ===== Basic Types =====

message UserInfo {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string avatar_url = 4;
}

message MessageContent {
  int32 msg_type = 1;  // 1=text 2=image 3=file 4=voice 5=system 6=recall 7=forward 8=quote
  string text = 2;
  string url = 3;
  string file_name = 4;
  int64 file_size = 5;
  int32 width = 6;
  int32 height = 7;
  int32 duration = 8;
  string extra = 9;
  int64 quote_msg_id = 10;     // for quote: referenced message ID
  string quote_text = 11;      // for quote: snippet of referenced message
  int64 quote_sender_id = 12;  // for quote: original sender
  int64 forward_from_session = 13; // for forward: source session
}

// ===== Auth =====

message AuthRequest {
  string token = 1;
  string device_id = 2;
  int32 platform = 3;
}

message AuthResponse {
  int32 code = 1;
  string msg = 2;
  UserInfo user_info = 3;
  int64 server_time = 4;
}

// ===== Heartbeat =====

message HeartbeatRequest {}

message HeartbeatResponse {
  int64 server_time = 1;
}

// ===== C2C Chat =====

message C2CMsgRequest {
  int64 receiver_id = 1;
  MessageContent content = 2;
  string client_msg_id = 3;
}

message C2CMsgResponse {
  int32 code = 1;
  string msg = 2;
  int64 msg_id = 3;
  int64 seq = 4;
  int64 server_time = 5;
}

message C2CMsgNotify {
  int64 msg_id = 1;
  int64 sender_id = 2;
  string session_id = 3;
  int64 seq = 4;
  MessageContent content = 5;
  int64 server_time = 6;
}

// ===== Group Chat =====

message GroupMsgRequest {
  int64 group_id = 1;
  MessageContent content = 2;
  string client_msg_id = 3;
  repeated int64 at_user_ids = 4;
}

message GroupMsgResponse {
  int32 code = 1;
  string msg = 2;
  int64 msg_id = 3;
  int64 seq = 4;
  int64 server_time = 5;
}

message GroupMsgNotify {
  int64 msg_id = 1;
  int64 sender_id = 2;
  int64 group_id = 3;
  string session_id = 4;
  int64 seq = 5;
  MessageContent content = 6;
  repeated int64 at_user_ids = 7;
  int64 server_time = 8;
}

// ===== Message Ack =====

message MsgAckRequest {
  int64 msg_id = 1;
  string session_id = 2;
  int64 seq = 3;
}

// ===== Message Read =====

message MsgReadRequest {
  string session_id = 1;
  int64 last_read_seq = 2;
}

message MsgReadNotify {
  int64 user_id = 1;
  string session_id = 2;
  int64 last_read_seq = 3;
}

// ===== Message Recall =====

message MsgRecallRequest {
  int64 msg_id = 1;
  string session_id = 2;
}

message MsgRecallNotify {
  int64 msg_id = 1;
  string session_id = 2;
  int64 operator_id = 3;
  int64 server_time = 4;
}

// ===== Offline Sync =====

message SyncRequest {
  repeated SyncPoint points = 1;
  int32 limit = 2;
}

message SyncPoint {
  string session_id = 1;
  int64 last_seq = 2;
}

message SyncResponse {
  repeated SessionMessages sessions = 1;
}

message SessionMessages {
  string session_id = 1;
  repeated Message messages = 2;
  bool has_more = 3;
}

message Message {
  int64 msg_id = 1;
  int64 sender_id = 2;
  int64 seq = 3;
  MessageContent content = 4;
  int64 server_time = 5;
  bool is_recalled = 6;
}

// ===== Session =====

message SessionListRequest {
  int64 last_update_time = 1;
  int32 limit = 2;
}

message SessionListResponse {
  repeated SessionInfo sessions = 1;
}

message SessionInfo {
  string session_id = 1;
  int32 type = 2;
  int64 target_id = 3;
  string name = 4;
  string avatar_url = 5;
  string last_msg = 6;
  int64 last_msg_time = 7;
  int32 unread_count = 8;
  bool is_top = 9;
  bool is_muted = 10;
  int64 last_read_seq = 11;
}

// ===== Friend =====

message FriendApplyRequest {
  int64 target_user_id = 1;
  string message = 2;
}

message FriendApplyNotify {
  int64 from_user_id = 1;
  string from_nickname = 2;
  string message = 3;
}

message FriendAcceptRequest {
  int64 from_user_id = 1;
}

message FriendRejectRequest {
  int64 from_user_id = 1;
}

message FriendListRequest {
  int64 last_user_id = 1;
  int32 limit = 2;
}

message FriendListResponse {
  repeated UserInfo friends = 1;
}

message FriendRequestListResponse {
  repeated FriendRequestInfo requests = 1;
}

message FriendRequestInfo {
  int64 from_user_id = 1;
  string from_nickname = 2;
  string from_avatar_url = 3;
  string message = 4;
  int64 created_at = 5;
}

// ===== Group =====

message GroupCreateRequest {
  string name = 1;
  repeated int64 member_ids = 2;
}

message GroupCreateResponse {
  int32 code = 1;
  string msg = 2;
  int64 group_id = 3;
}

message GroupInviteRequest {
  int64 group_id = 1;
  repeated int64 user_ids = 2;
}

message GroupKickRequest {
  int64 group_id = 1;
  repeated int64 user_ids = 2;
}

message GroupDissolveRequest {
  int64 group_id = 1;
}

message GroupMemberListRequest {
  int64 group_id = 1;
  int64 last_user_id = 2;
  int32 limit = 3;
}

message GroupMemberListResponse {
  repeated GroupMember members = 1;
}

message GroupMember {
  UserInfo user_info = 1;
  int32 role = 2;
  int64 joined_at = 3;
}

// ===== File Upload =====

message FileUploadResponse {
  int32 code = 1;
  string msg = 2;
  string url = 3;
  string file_name = 4;
  int64 file_size = 5;
}

// ===== Generic Response =====

message GenericResponse {
  int32 code = 1;
  string msg = 2;
}
